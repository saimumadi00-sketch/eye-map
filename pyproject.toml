[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eyemap"
version = "0.1.0"
requires-python = ">=3.10"
authors = [
    { name = "EyeMap Contributors" },
]
dependencies = [
    "numpy",
    "opencv-python",
    "pyyaml",
]

[project.optional-dependencies]
viz = [
    "open3d",
]
drone = [
    "pyserial>=3.5",
    "pymavlink>=2.4.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
eyemap-run = "main:main"
eyemap-vkitti = "scripts.run_vkitti:main"
eyemap-evaluate = "src.mvp.evaluate:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "scripts", "scripts.*", "config"]
namespaces = false

[tool.setuptools.package-data]
config = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
